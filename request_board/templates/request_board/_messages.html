{% load static %}
{% if messages %}
    <div class="request-board__toasts" aria-label="Notifikasi" role="region" data-toast-region>
      {% for message in messages %}
        <div id="toast-message-{{ forloop.counter }}"
             class="request-board__toast request-board__alert request-board__alert--{{ message.level_tag|default:'info' }}"
             tabindex="-1"
             {% if message.level_tag == 'error' %}role="alert" aria-live="assertive"{% else %}role="status" aria-live="polite"{% endif %}>
           <span class="request-board__toast-icon">
             {% if message.level_tag == 'error' %}
               <img src="{% static 'request-board/toast-error.svg' %}" alt="">
             {% elif message.level_tag == 'success' %}
               <img src="{% static 'request-board/toast-success.svg' %}" alt="">
             {% else %}
               <img src="{% static 'request-board/toast-warning.svg' %}" alt="">
             {% endif %}
           </span>
           <span>{{ message }}</span>
           <button type="button" class="request-board__toast-close" aria-label="Tutup notifikasi">
             <img src="{% static 'request-board/close.svg' %}" alt="" width="24" height="24">
           </button>
        </div>
      {% endfor %}
    </div>
{% endif %}
  <script>
    (function () {
      function enhanceToast(toast) {
        var region = toast.parentElement;
        var button = toast.querySelector('.request-board__toast-close');
        region.classList.add('request-board__toasts--dismissible');
        var lifetime = toast.classList.contains('request-board__alert--success') ? 4000 : 6000;
        var timer;
        function dismiss() {
          window.clearTimeout(timer);
          if (!toast.isConnected) return;
          var hadFocus = toast.contains(document.activeElement);
          var adjacent = toast.nextElementSibling || toast.previousElementSibling;
          toast.remove();
          if (hadFocus) {
            if (adjacent) {
              adjacent.querySelector('button').focus({ preventScroll: true });
            } else {
              var main = document.querySelector('main');
              if (main) {
                if (!main.hasAttribute('tabindex')) main.setAttribute('tabindex', '-1');
                main.focus({ preventScroll: true });
              }
            }
          }
          if (!region.children.length) region.remove();
        }
        function pause() { window.clearTimeout(timer); }
        function resume() {
          pause();
          if (!toast.isConnected || toast.contains(document.activeElement) || toast.matches(':hover')) return;
          timer = window.setTimeout(dismiss, lifetime);
        }
        button.addEventListener('click', dismiss);
        toast.addEventListener('mouseenter', pause);
        toast.addEventListener('mouseleave', resume);
        toast.addEventListener('focusin', pause);
        toast.addEventListener('focusout', function (event) {
          if (!toast.contains(event.relatedTarget)) resume();
        });
        resume();
      }

      document.querySelectorAll('[data-toast-region] .request-board__toast').forEach(enhanceToast);

      // AJAX notices use the same markup and lifetime as server-rendered messages.
      window.showRequestBoardToast = function (message, isError, loginUrl) {
        var previous = document.querySelector('[data-toast-region] [data-ajax-notice]');
        if (previous) previous.remove();
        var region = document.querySelector('[data-toast-region]');
        if (!region) {
          region = document.createElement('div');
          region.className = 'request-board__toasts';
          region.setAttribute('aria-label', 'Notifikasi');
          region.setAttribute('role', 'region');
          region.dataset.toastRegion = '';
          document.body.appendChild(region);
        }
        var toast = document.createElement('div');
        toast.className = 'request-board__toast request-board__alert request-board__alert--' + (isError ? 'error' : 'success');
        toast.dataset.ajaxNotice = '';
        toast.setAttribute('role', isError ? 'alert' : 'status');
        toast.setAttribute('aria-live', isError ? 'assertive' : 'polite');
        toast.tabIndex = -1;
        var icon = document.createElement('span');
        icon.className = 'request-board__toast-icon';
        var image = document.createElement('img');
        image.src = isError ? "{% static 'request-board/toast-error.svg' %}" : "{% static 'request-board/toast-success.svg' %}";
        image.alt = '';
        icon.appendChild(image);
        var text = document.createElement('span');
        text.textContent = message;
        if (loginUrl) {
          var link = document.createElement('a');
          link.href = loginUrl;
          link.textContent = ' Masuk';
          text.appendChild(link);
        }
        var close = document.createElement('button');
        close.type = 'button';
        close.className = 'request-board__toast-close';
        close.setAttribute('aria-label', 'Tutup notifikasi');
        var closeIcon = document.createElement('img');
        closeIcon.src = "{% static 'request-board/close.svg' %}";
        closeIcon.alt = '';
        closeIcon.width = 24;
        closeIcon.height = 24;
        close.appendChild(closeIcon);
        toast.append(icon, text, close);
        region.appendChild(toast);
        enhanceToast(toast);
        return toast;
      };
    })();
  </script>
