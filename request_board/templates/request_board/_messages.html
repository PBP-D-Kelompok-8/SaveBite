{% if messages %}
  <a href="#toast-message-1"
     id="board-feedback-anchor"
     class="request-board__feedback-anchor"
     tabindex="-1"
     autofocus
     aria-labelledby="{% for message in messages %}toast-message-{{ forloop.counter }}{% if not forloop.last %} {% endif %}{% endfor %}">
    <div class="request-board__toasts" aria-label="Notifikasi" role="region">
      {% for message in messages %}
        <div id="toast-message-{{ forloop.counter }}"
             class="request-board__toast request-board__alert request-board__alert--{{ message.level_tag|default:'info' }}"
             tabindex="-1"
             {% if message.level_tag == 'error' %}role="alert" aria-live="assertive"{% else %}role="status" aria-live="polite"{% endif %}>
          {{ message }}
        </div>
      {% endfor %}
    </div>
  </a>
  <style>
    .request-board__feedback-anchor {
      display: block;
      color: inherit;
      text-decoration: none;
    }
    .request-board__feedback-anchor:focus-within {
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .request-board__feedback-anchor:focus,
    .request-board__toast:focus { outline: 3px solid var(--accent-dark-green); outline-offset: -3px; }
  </style>
  <script>
    (function () {
      var toast = document.querySelector('.request-board__toast');
      if (toast) {
        toast.focus();
        window.addEventListener('DOMContentLoaded', function () {
          toast.focus();
        });
      }
    })();
  </script>
{% endif %}
