{% load static %}
 
    <nav class="recipes-filters" aria-label="Filter resep">
        <a
            class="recipe-filter {% if filter_type == 'all' %}is-active{% endif %}"
            href="{% url 'resep_komunitas:recipe_list' %}?filter=all"
            hx-get="{% url 'resep_komunitas:recipe_list' %}?filter=all"
            hx-target="#recipes-grid-cards"
            hx-swap="innerHTML"
            hx-push-url="true"
        >Semua</a>

        {% if user.is_authenticated %}
            <a
                class="recipe-filter {% if filter_type == 'mine' %}is-active{% endif %}"
                href="{% url 'resep_komunitas:recipe_list' %}?filter=mine"
                hx-get="{% url 'resep_komunitas:recipe_list' %}?filter=mine"
                hx-target="#recipes-grid-cards"
                hx-swap="innerHTML"
                hx-push-url="true"
            >Resep Anda</a>
        {% endif %}
    </nav>

    {% if recipes %}
        
        {% include 'recipe_card.html' with recipes=recipes %}
        
    {% else %}
        <div class="recipes-empty">
            <h4 class="h4">Belum ada resep yang ditemukan</h4>
            <p class="p3">Coba kata kunci lain atau bagikan resep pertamamu</p>
        </div>
    {% endif %}
