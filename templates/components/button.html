{% load static %}
{% comment %}
  Parameter tambahan: submit=True → dirender sebagai <button type="submit"> (untuk form).
  Tanpa submit → tetap <a href> seperti sebelumnya.
{% endcomment %}
{% if submit %}
<button type="submit" class="btn btn--{{ type|default:'primary' }} btn--{{ color|default:'dark-green' }}"{% if disabled %} disabled{% endif %}>
{% else %}
<a href="{{ href|default:'#' }}" 
   class="btn btn--{{ type|default:'primary' }} btn--{{ color|default:'dark-green' }}" 
   {% if disabled %} aria-disabled="true" tabindex="-1"{% endif %}>
{% endif %}
    
    {% if icon_left %}
        <span class="btn__icon" style="--icon: url('{% static icon_left %}')" aria-hidden="true"></span>
    {% elif icon %}
        <span class="btn__icon" style="--icon: url('{% static icon %}')" aria-hidden="true"></span>
    {% endif %}

    {{ label }}

    {% if icon_right %}
        <span class="btn__icon" style="--icon: url('{% static icon_right %}')" aria-hidden="true"></span>
    {% endif %}
{% if submit %}</button>{% else %}</a>{% endif %}
